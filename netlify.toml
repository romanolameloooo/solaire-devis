# Déploiement Netlify. Netlify détecte Next.js et installe automatiquement son adaptateur
# (protection des pages, images de partage, en-têtes de sécurité : tout fonctionne comme en local).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Active explicitement le moteur Next.js de Netlify (pages dynamiques, connexion, images de partage).
# Sans lui, Netlify publie le dossier .next comme de simples fichiers et toutes les pages répondent 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
